name: ci

on:
  push:
    branches:
      - main
      - "release-please--branches--**"
  pull_request:
    branches:
      - main

permissions: read-all

jobs:
  vet:
    name: Go Vet (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            name: main
          - module: ./dinoweights
            name: dinoweights
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Run Go Vet
        shell: bash
        working-directory: ${{ matrix.module }}
        run: |
          set +e
          OUTPUT=$(go vet ./... 2>&1)
          EXIT_CODE=$?
          set -e

          {
            echo "## Go Vet (${{ matrix.name }})"
            echo ""
            if [ $EXIT_CODE -eq 0 ]; then
              echo "All packages pass vet checks."
            else
              echo "**Issues found:**"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

  lint:
    name: Lint (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            name: main
          - module: ./dinoweights
            name: dinoweights
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Run Linter
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.10.1
          args: ./...
          working-directory: ${{ matrix.module }}

  vulncheck:
    name: Vulnerability Check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            name: main
          - module: ./dinoweights
            name: dinoweights
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        shell: bash
        working-directory: ${{ matrix.module }}
        run: |
          set +e
          OUTPUT=$(govulncheck ./... 2>&1)
          EXIT_CODE=$?
          set -e

          {
            echo "## Vulnerability Check (${{ matrix.name }})"
            echo ""
            if [ $EXIT_CODE -eq 0 ]; then
              echo "No known vulnerabilities found."
            else
              echo "**Vulnerabilities found:**"
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit $EXIT_CODE

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: .
            name: main
          - module: ./dinoweights
            name: dinoweights
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Run Tests
        shell: bash
        working-directory: ${{ matrix.module }}
        run: |
          set +e
          go test -covermode=atomic -coverprofile=coverage.out -coverpkg=./... -json ./... > test-output.json 2>&1
          TEST_EXIT=$?
          set -e

          MODULE=$(GOWORK=off go list -m)
          grep '^\{' test-output.json > test-results.json 2>/dev/null || true

          TESTS_PASSED=$(jq -s '[.[] | select(.Test != null and .Action == "pass")] | length' test-results.json 2>/dev/null || echo 0)
          TESTS_FAILED=$(jq -s '[.[] | select(.Test != null and .Action == "fail")] | length' test-results.json 2>/dev/null || echo 0)
          TESTS_SKIPPED=$(jq -s '[.[] | select(.Test != null and .Action == "skip")] | length' test-results.json 2>/dev/null || echo 0)

          {
            echo "## Test Results (${{ matrix.name }})"
            echo ""
            if [ "$TEST_EXIT" -eq 0 ]; then
              echo "All tests passed."
            else
              echo "**Some tests failed.**"
            fi
            echo ""
            echo "| Passed | Failed | Skipped |"
            echo "|--------|--------|---------|"
            echo "| $TESTS_PASSED | $TESTS_FAILED | $TESTS_SKIPPED |"
          } >> "$GITHUB_STEP_SUMMARY"

          PKG_RESULTS=$(jq -r 'select(.Test == null and (.Action == "pass" or .Action == "fail" or .Action == "skip")) | "\(.Action)\t\(.Package)\t\(.Elapsed)"' test-results.json 2>/dev/null || true)

          if [ -n "$PKG_RESULTS" ]; then
            {
              echo ""
              echo "### Packages"
              echo ""
              echo "| Package | Status | Duration |"
              echo "|---------|--------|----------|"
              echo "$PKG_RESULTS" | while IFS=$'\t' read -r action pkg elapsed; do
                short_pkg=$(echo "$pkg" | sed "s|${MODULE}/|./|g; s|${MODULE}|.|g")
                printf '| `%s` | %s | %ss |\n' "$short_pkg" "$action" "$elapsed"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$TESTS_FAILED" -gt 0 ]; then
            {
              echo ""
              echo "### Failed Tests"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            jq -r 'select(.Test != null and .Action == "fail") | "\(.Package)\t\(.Test)"' test-results.json 2>/dev/null | while IFS=$'\t' read -r pkg test; do
              short_pkg=$(echo "$pkg" | sed "s|${MODULE}/|./|g; s|${MODULE}|.|g")
              OUTPUT=$(jq -rj --arg pkg "$pkg" --arg test "$test" \
                'select(.Package == $pkg and .Test == $test and .Action == "output") | .Output // empty' \
                test-results.json 2>/dev/null || true)
              {
                echo "<details>"
                echo "<summary><code>$short_pkg :: $test</code></summary>"
                echo ""
                echo '```'
                echo "$OUTPUT"
                echo '```'
                echo ""
                echo "</details>"
              } >> "$GITHUB_STEP_SUMMARY"
            done
          fi

          exit $TEST_EXIT

      - name: Upload Per-Module Coverage
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.module }}/coverage.out
          if-no-files-found: ignore

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test
    if: success() || failure()
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: coverage-artifacts
      - name: Merge Coverage
        shell: bash
        run: |
          shopt -s nullglob
          PROFILES=(coverage-artifacts/*/coverage.out)
          if [ ${#PROFILES[@]} -eq 0 ]; then
            {
              echo "## Coverage"
              echo ""
              echo "No coverage data available."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gocovmerge "${PROFILES[@]}" > coverage.out

          COVER_OUTPUT=$(go tool cover -func=coverage.out)
          COVERAGE=$(echo "$COVER_OUTPUT" | grep "^total:" | awk '{print $NF}' | tr -d '%')

          {
            echo "## Coverage"
            echo ""
            if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
              echo "**Total: ${COVERAGE}%** (threshold: 80%)"
            else
              echo "**Total: ${COVERAGE}% — BELOW 80% THRESHOLD**"
            fi
            echo ""
            echo "<details>"
            echo "<summary>Per-function breakdown</summary>"
            echo ""
            echo "| File | Function | Coverage |"
            echo "|------|----------|----------|"
            echo "$COVER_OUTPUT" | grep -v "^total:" | awk '{printf "| %s | %s | %s |\n", $1, $2, $NF}'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 80% threshold"
            exit 1
          fi

      - name: Upload Merged Coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Run Fuzz Tests
        shell: bash
        run: |
          set +e
          FUZZ_TIME=10s
          TARGETS=$(grep -o 'func Fuzz[A-Za-z0-9_]*' fuzz_test.go | sed 's/^func //')
          TOTAL=$(echo "$TARGETS" | wc -l | tr -d ' ')
          PASSED=0
          FAILED=0
          FAILED_TARGETS=""

          for target in $TARGETS; do
            echo "::group::Fuzzing $target for $FUZZ_TIME"
            OUTPUT=$(go test -run='^$' -fuzz="^${target}$" -fuzztime="$FUZZ_TIME" 2>&1)
            EXIT_CODE=$?
            echo "$OUTPUT"
            echo "::endgroup::"

            if [ $EXIT_CODE -eq 0 ]; then
              PASSED=$((PASSED + 1))
            else
              FAILED=$((FAILED + 1))
              FAILED_TARGETS="$FAILED_TARGETS $target"
            fi
          done

          {
            echo "## Fuzz Tests"
            echo ""
            if [ "$FAILED" -eq 0 ]; then
              echo "All fuzz targets passed ($FUZZ_TIME per target)."
            else
              echo "**Some fuzz targets failed.**"
            fi
            echo ""
            echo "| Passed | Failed | Total |"
            echo "|--------|--------|-------|"
            echo "| $PASSED | $FAILED | $TOTAL |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAILED" -gt 0 ]; then
            {
              echo ""
              echo "### Failed Targets"
              echo ""
              for target in $FAILED_TARGETS; do
                echo "- \`$target\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  coveralls:
    name: Publish Coverage Report
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: coverage
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25"
      - name: Install Goveralls
        run: go install github.com/mattn/goveralls@v0.0.12
      - name: Download Coverage Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
      - name: Publish to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goveralls -coverprofile=coverage.out -service=github
