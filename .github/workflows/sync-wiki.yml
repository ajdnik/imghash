name: sync-wiki

on:
  push:
    branches:
      - main
    paths:
      - "wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    name: Sync Wiki Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync wiki markdown pages
        env:
          WIKI_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::Missing required secret RELEASE_PLEASE_TOKEN."
            echo "::error::Add a PAT with repo scope as RELEASE_PLEASE_TOKEN in repository secrets."
            exit 1
          fi

          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "${WIKI_URL}" >/dev/null 2>&1; then
            echo "::error::Cannot access ${GITHUB_REPOSITORY}.wiki.git."
            echo "::error::Ensure Wiki is enabled and initialized with at least one page, and RELEASE_PLEASE_TOKEN has repo access."
            exit 1
          fi

          git clone "${WIKI_URL}" wiki-repo

          # Keep the wiki source in this repo authoritative.
          # GitHub wikis are a flat namespace (page slug = filename, no
          # subdirectories), so every page lives at the wiki root. Mirror every
          # root-level .md file and prune anything left behind.
          find wiki-repo -mindepth 1 -path wiki-repo/.git -prune -o -type f -name '*.md' -print -exec rm -f {} +
          find wiki-repo -mindepth 1 -not -path 'wiki-repo/.git' -not -path 'wiki-repo/.git/*' -type d -empty -delete
          (cd wiki && find . -type f -name '*.md' -print0 | tar --null -cf - -T -) | tar -xf - -C wiki-repo

          cd wiki-repo

          if [ -z "$(git status --porcelain)" ]; then
            echo "No wiki changes to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: sync wiki from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
